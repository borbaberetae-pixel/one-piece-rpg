<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Piece RPG</title><style>
*{box-sizing:border-box}body{margin:0;background:#191524;color:#f2eaf6;font:14px system-ui;padding:12px}header{background:linear-gradient(135deg,#39253f,#211a2c);border:1px solid #73563e;border-radius:12px;padding:15px;margin-bottom:12px}small{color:#e7c17b;letter-spacing:2px}h1{font-size:24px;margin:5px 0 12px;color:#f4d498}select,input,textarea,button{font:inherit;color:inherit;background:#292235;border:1px solid #594762;border-radius:7px;padding:9px;width:100%;min-width:0}input:focus,textarea:focus{outline:2px solid #c9a46d}textarea{min-height:86px;resize:vertical}button{cursor:pointer}button[aria-pressed=true]{background:#e7c17b;color:#211a2c;border-color:#e7c17b;font-weight:bold}nav,.row{display:flex;gap:6px;margin:10px 0}nav button{font-size:12px;padding:9px 3px}section{background:#211b2e;border:1px solid #43364f;border-radius:10px;padding:12px;margin:10px 0}section[hidden]{display:none}h3{font-size:15px;color:#e7c17b;margin:0 0 12px;border-bottom:1px solid #51435d;padding-bottom:9px}section:nth-child(2) h3{color:#f29b9b}section:nth-child(3) h3{color:#8cc9ed}section:nth-child(5) h3{color:#c7a4f5}label{display:block;color:#cbbbd8;font-size:11px;font-weight:600}label input,label textarea{display:block;margin-top:5px;font-size:14px;font-weight:400}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stats input{text-align:center;font-size:20px}.stack{display:grid;gap:12px}#status{font-size:11px;color:#cbbbd8;margin-top:9px}button:disabled,input:disabled,textarea:disabled{opacity:.55}footer button{font-size:12px}.loot-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.loot-head b{color:#e7c17b}.loot-card{background:#292235;border:1px solid #594762;border-left:4px solid var(--rarity,#aaa);border-radius:9px;padding:10px;margin:9px 0}.loot-card .row{margin:7px 0}.loot-card textarea{min-height:55px}.loot-card button{width:auto;min-width:34px}.loot-card .qty{width:58px;text-align:center}.loot-card .remove{color:#f29b9b;margin-left:auto}.loot-card select{font-size:12px}.loot-add{background:#e7c17b;color:#211a2c;font-weight:700}.loot-empty{color:#cbbbd8;text-align:center;padding:16px;font-size:12px}.loot-card label{margin-top:8px} .loot-head{display:grid;grid-template-columns:1fr 1fr;gap:10px}.loot-head>div{background:#30283e;border-radius:9px;padding:12px}.loot-head span{display:block;color:#cbbbd8;font-size:11px}.loot-head b{display:block;font-size:23px;color:#f2eaf6;margin-top:4px}.loot-card{border:1px solid var(--rarity);border-radius:12px;padding:14px;margin:12px 0}.loot-card .rarity-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:var(--rarity);font-weight:700}.loot-card .remove{background:transparent;border:0;color:#cbbbd8;font-size:18px;padding:4px}.loot-card .row{align-items:center;justify-content:flex-end;margin:14px 0}.loot-card .qty-label{margin-right:auto;color:#cbbbd8;font-size:12px}.loot-card .qty{background:transparent;border:0;font-size:19px;font-weight:bold;width:55px}.loot-card textarea{min-height:75px}.loot-card input,.loot-card select,.loot-card textarea{background:#191524}.loot-add{padding:12px}.loot-card label{font-size:12px}</style><header><small>GRAND LINE • RPG</small><h1>🏴‍☠️ One Piece RPG</h1><select id="sheet"><option value="a">Personagem 1</option><option value="b">Personagem 2</option></select><div id="status">Conectando à sala…</div></header><nav><button data-tab>Personagem</button><button data-tab>Habilidades</button><button data-tab>Inventário</button></nav><main id="fields"></main><footer class="row"><button id="export">Exportar ficha</button><button id="import">Importar ficha</button><input id="file" type="file" accept=".json" hidden></footer><script type="module">import OBR from 'https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm';
const prefix='one-piece-rpg.fichas/';
const groups=[['⚓ Identidade',['Nome','Idade','Raça','Classe','Subclasse','Nível','XP','Berries','Recompensa','Tripulação','Origem','Sonho']],['❤️ Status',['Vida atual','Vida máxima','Mana atual','Mana máxima','Stamina atual','Stamina máxima','Haki atual','Haki máximo','Defesa','Movimentação']],['◆ Atributos',['Força','Destreza','Constituição','Inteligência','Sabedoria','Carisma','Percepção']],['✦ Perícias e talentos',['Perícias','Talentos','Habilidades raciais','Habilidades de classe','Habilidades de subclasse']],['🍎 Akuma no Mi e Haki',['Akuma no Mi','Habilidades ativas da fruta','Habilidades passivas da fruta','Haki','Armamento','Observação','Rei']],['⚔ Equipamentos',['Armas','Equipamentos','Inventário']],['📜 Diário',['História','Anotações']]];
const $=id=>document.getElementById(id);let metadata={},ready=false;const inputs=new Map();const key=(slot,field)=>prefix+slot+'/'+field;const slot=()=>$('sheet').value;const status=t=>$('status').textContent=t;
for(const [i,[title,fields]] of groups.entries()){const section=document.createElement('section');const h=document.createElement('h3');h.textContent=title;section.append(h);const box=document.createElement('div');box.className=i===2?'grid stats':i<2?'grid':'stack';for(const field of fields){const label=document.createElement('label');label.textContent=field;const el=document.createElement(i>=3?'textarea':'input');el.placeholder=i>=3?'Adicionar informações…':'—';el.disabled=true;label.append(el);box.append(label);inputs.set(field,el);el.addEventListener('change',()=>save(slot(),field,el.value));}section.append(box);$('fields').append(section);}
const lootSection=document.createElement('section');lootSection.innerHTML='<h3>🎒 Mochila de aventureiro</h3><div class="loot-head"><div><span>Tipos de item</span><b id="loot-count">0</b></div><div><span>Quantidade total</span><b id="loot-total">0</b></div></div><button class="loot-add" id="loot-add" disabled>＋ Adicionar item</button><div id="loot-list"></div>'; $('fields').insertBefore(lootSection,$('fields').children[5]);
const lootField='Inventário estruturado';const rarities={'Comum':'#a5a5b0','Incomum':'#65c68a','Raro':'#66aaff','Épico':'#b68cff','Lendário':'#e7c17b','Mítico':'#f18b8b'};const categories=['Material','Consumível','Tesouro','Acessório','Equipamento','Item especial','Missão','Outro'];
function getLoot(s=slot()){try{const a=JSON.parse(metadata[key(s,lootField)]||'[]');return Array.isArray(a)?a:[]}catch{return []}}
let lootQueue=Promise.resolve();function editLoot(s,fn,force=true){if(!ready)return;lootQueue=lootQueue.catch(()=>{}).then(async()=>{const a=getLoot(s);fn(a);await save(s,lootField,JSON.stringify(a));if(s===slot())drawLoot(force);});}
function drawLoot(force=false){const root=$('loot-list');if(!force&&root.contains(document.activeElement))return;root.replaceChildren();const a=getLoot();$('loot-add').disabled=!ready;$('loot-count').textContent=a.length;$('loot-total').textContent=a.reduce((n,x)=>n+(Number(x.qty)||0),0);if(!a.length){const e=document.createElement('div');e.className='loot-empty';e.textContent='Sua mochila está vazia.';root.append(e);}for(const item of a){const s=slot();const card=document.createElement('div');card.className='loot-card';card.style.setProperty('--rarity',rarities[item.rarity]||'#aaa');const update=(f,v)=>editLoot(s,arr=>{const x=arr.find(x=>x.id===item.id);if(x)x[f]=v},f==='rarity');function control(tag,f,opts){const e=document.createElement(tag);if(opts)for(const o of opts){const op=document.createElement('option');op.value=op.textContent=o;e.append(op)}e.value=item[f]??'';e.disabled=!ready;e.onchange=()=>update(f,e.value);return e}function labeled(t,e,parent=card){const l=document.createElement('label');l.textContent=t;l.append(e);parent.append(l)}const head=document.createElement('div');head.className='rarity-head';const badge=document.createElement('span');badge.textContent='◆ '+(item.rarity||'Comum');head.append(badge);const del=document.createElement('button');del.className='remove';del.textContent='✕';del.title='Excluir item';del.disabled=!ready;del.onclick=()=>{if(confirm('Remover este item?'))editLoot(s,arr=>{const i=arr.findIndex(x=>x.id===item.id);if(i>=0)arr.splice(i,1)})};head.append(del);card.append(head);const name=control('input','name');name.placeholder='Nome do item';labeled('Nome do item',name);const grid=document.createElement('div');grid.className='grid';labeled('Categoria',control('select','category',categories),grid);labeled('Raridade',control('select','rarity',Object.keys(rarities)),grid);card.append(grid);const row=document.createElement('div');row.className='row';function btn(t,fn){const b=document.createElement('button');b.textContent=t;b.disabled=!ready;b.onclick=fn;row.append(b);return b}const adjust=d=>editLoot(s,arr=>{const x=arr.find(x=>x.id===item.id);if(x)x.qty=Math.max(0,(Number(x.qty)||0)+d)});const qlabel=document.createElement('span');qlabel.className='qty-label';qlabel.textContent='Quantidade';row.append(qlabel);btn('−',()=>adjust(-1));const qty=control('input','qty');qty.type='number';qty.min='0';qty.className='qty';qty.onchange=()=>update('qty',Math.max(0,Math.floor(Number(qty.value)||0)));row.append(qty);btn('+',()=>adjust(1));card.append(row);const desc=control('textarea','desc');desc.placeholder='Efeito, valor, origem ou observações…';labeled('Descrição e efeitos',desc);root.append(card)}}
$('loot-add').onclick=()=>editLoot(slot(),a=>a.push({id:crypto.randomUUID(),name:'Novo item',qty:1,category:'Outro',rarity:'Comum',desc:''}));
const tabs=[...document.querySelectorAll('[data-tab]')];function tab(n){document.querySelectorAll('#fields section').forEach((s,i)=>s.hidden=!(n===0?i<3:n===1?i>=3&&i<=4:i>=5));tabs.forEach((t,i)=>t.setAttribute('aria-pressed',String(i===n)));}tabs.forEach((t,i)=>t.onclick=()=>tab(i));tab(0);
function render(){for(const [field,el] of inputs){if(document.activeElement!==el)el.value=metadata[key(slot(),field)]??'';el.disabled=!ready;}drawLoot();}
async function save(s,f,v){if(!ready)return;try{await OBR.room.setMetadata({[key(s,f)]:v});metadata[key(s,f)]=v;status('Alteração enviada à sala.');}catch(e){status('Erro ao salvar: '+e.message);}}
$('sheet').addEventListener('change',()=>{for(const [f,el] of inputs)el.value=metadata[key(slot(),f)]??'';drawLoot(true);});
$('export').onclick=()=>{const data=Object.fromEntries([...inputs].map(([f,e])=>[f,e.value]));data[lootField]=JSON.stringify(getLoot());const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ficha-'+slot()+'.json';a.click();URL.revokeObjectURL(url);};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{if(!ready)return;try{const data=JSON.parse(await $('file').files[0].text());const s=slot();const patch={};for(const f of inputs.keys())if(typeof data[f]==='string'||typeof data[f]==='number')patch[key(s,f)]=String(data[f]);if(typeof data[lootField]==='string'){const a=JSON.parse(data[lootField]);if(!Array.isArray(a))throw Error('Inventário inválido');patch[key(s,lootField)]=JSON.stringify(a);}await OBR.room.setMetadata(patch);Object.assign(metadata,patch);render();status('Ficha importada.');}catch(e){status('Falha na importação: '+e.message);}};
OBR.onReady(async()=>{try{metadata=await OBR.room.getMetadata();ready=true;OBR.room.onMetadataChange(m=>{metadata=m;render();});render();status('Conectado à sala. Clique fora do campo para salvar.');}catch(e){status('Falha na conexão: '+e.message);}});
</script></html>
