<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fichas RPG</title><style>*{box-sizing:border-box}body{background:#191524;color:#eee;font:14px system-ui;margin:0;padding:14px}h2{color:#e7c17b;margin:0 0 12px}h3{color:#e7c17b;border-bottom:1px solid #51435d;padding-bottom:6px}input,textarea,select,button{font:inherit;color:inherit;background:#30283e;border:1px solid #62536e;border-radius:6px;padding:8px;width:100%}textarea{min-height:75px;resize:vertical}button{cursor:pointer}label{display:block;color:#c6b8d4;font-size:12px;margin-bottom:8px}label input,label textarea{display:block;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;gap:6px;margin-bottom:8px}#status{font-size:12px;color:#c6b8d4;margin:8px 0}button:disabled{opacity:.5}</style><h2>🏴‍☠️ One Piece RPG</h2><div class="row"><select id="sheet"><option value="a">Personagem 1</option><option value="b">Personagem 2</option></select></div><div id="status">Conectando à sala…</div><div id="fields"></div><div class="row"><button id="export">Exportar ficha</button><button id="import">Importar ficha</button><input id="file" type="file" accept=".json" hidden></div><script type="module" src="./app.js"></script></html>
